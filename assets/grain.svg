<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Wood-grain texture for image placeholders: stretched fractal noise = fibre lines. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0 0.04  1.6 0 0 0 -0.62"/>
  </filter>
  <rect width="640" height="640" filter="url(#g)"/>
</svg>
